services:
  - type: web
    name: bybit-ai-agent-demo
    runtime: docker
    plan: free
    region: frankfurt
    branch: feat/bybit-ai-agent-demo
    rootDir: bybit-agent
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BYBIT_TESTNET
        value: "true"
      - key: TRADING_ENABLED
        value: "false"
      - key: REQUIRE_ACCESS_TOKEN
        value: "true"
      - key: AGENT_ACCESS_TOKEN
        sync: false
