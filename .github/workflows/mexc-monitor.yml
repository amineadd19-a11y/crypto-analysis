name: MEXC monitor tests
on:
  push:
    paths:
      - 'mexc-reversal-monitor/**'
      - '.github/workflows/mexc-monitor.yml'
  pull_request:
    paths:
      - 'mexc-reversal-monitor/**'
      - '.github/workflows/mexc-monitor.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mexc-reversal-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
